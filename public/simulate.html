<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus DeviceSync - Pixel-Accurate Multi-Device Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Device-Specific Precision Screen & Outer Frame Radii */
    .radius-iphone-17 { border-radius: 54px; }
    .radius-iphone-17-screen { border-radius: 46px; }

    .radius-iphone-air { border-radius: 52px; }
    .radius-iphone-air-screen { border-radius: 44px; }

    .radius-galaxy-s25 { border-radius: 40px; }
    .radius-galaxy-s25-screen { border-radius: 34px; }

    /* Ultra series boxy sharp corners */
    .radius-galaxy-ultra { border-radius: 8px; }
    .radius-galaxy-ultra-screen { border-radius: 4px; }

    /* Foldable series - Crisp tight architectural corners matching Z Fold 8 */
    .radius-fold-main { border-radius: 8px; }
    .radius-fold-main-screen { border-radius: 5px; }

    /* MacBook Screen Radii */
    .radius-macbook-screen { border-radius: 14px 14px 0 0; }

    /* Smooth scale transitions */
    .viewport-container {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), width 0.25s ease, height 0.25s ease;
    }

    .device-shadow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

    </div>

    <!-- URL NAVIGATION PILL -->

        <!-- BOOKMARK TOGGLE BUTTON -->

        </button>

        <button type="submit" title="Navigate to URL" class="absolute right-1.5 w-7 h-7 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center text-xs shadow-md transition transform active:scale-95">

        </button>
      </form>

        id="bookmarks-dropdown"

        </div>
        <div id="bookmarks-list" class="max-h-56 overflow-y-auto py-1">

      </div>
    </div>

    function buildDeviceSelectOptionsHtml(selectedKey) {
      const groups = {
        'Apple iPhone & iPad': ['iphone-17-promax', 'iphone-17-pro', 'iphone-17', 'iphone-air', 'ipad-pro-13'],
        'Samsung Galaxy Series': ['galaxy-s26-ultra', 'galaxy-s26', 'galaxy-zfold8-ultra', 'galaxy-zfold8', 'galaxy-s25-ultra', 'galaxy-s25'],
        'Mac & Desktop Monitors': ['macbook-air-13', 'macbook-pro-14', 'macbook-air-15', 'macbook-pro-16', 'monitor-24-4k', 'monitor-34-ultrawide']
      };

      let html = '';
      for (const [groupLabel, keys] of Object.entries(groups)) {
        html += `<optgroup label="${groupLabel}">`;
        keys.forEach(k => {
          const spec = DEVICE_CATALOG[k];
          if (spec) {
            const isSelected = k === selectedKey ? 'selected' : '';
            html += `<option value="${k}" ${isSelected}>${spec.name}</option>`;
          }
        });
        html += `</optgroup>`;
      }
      return html;
    }

    function buildStatusBarHtml(spec) {
      if (spec.osType === 'ios') {
        const pillWidth = spec.notchWidth || 122;
        const pillHeight = spec.notchHeight || 35;

        return `

            <!-- Left Time -->
            <span class="text-[14px] font-semibold tracking-tight pl-1 pt-0.5">${spec.timeString}</span>

            <!-- Dynamic Island Pill Cutout (Pixel-Accurate 1:1 Scale) -->
            ${spec.notchType === 'dynamic-island' ? `
              <div class="absolute left-1/2 -translate-x-1/2 top-[11px] bg-black rounded-full border border-slate-800/80 flex items-center justify-between px-3.5 z-40 shadow-sm" style="width: ${pillWidth}px; height: ${pillHeight}px;">

                  <div class="w-[5px] h-[5px] rounded-full bg-indigo-950/80 border border-indigo-700/50"></div>
                </div>
                <div class="w-[13px] h-[13px] rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center">
                  <div class="w-[4px] h-[4px] rounded-full bg-slate-900"></div>
                </div>
              </div>
            ` : ''}

                <div class="w-[8px] h-[8px] bg-black rounded-full border border-slate-800 flex items-center justify-center">

                </div>
                <div class="w-[5px] h-[5px] bg-slate-900/80 rounded-full"></div>
              </div>

              <span class="text-[11px] font-bold tracking-tighter">5G</span>
              <i class="fa-solid fa-wifi text-[11px]"></i>
              <div class="w-[22px] h-[11px] rounded-[3px] border border-white/80 p-[1.5px] relative flex items-center">
                <div class="h-full w-[85%] bg-white rounded-[1px]"></div>
                <div class="absolute -right-[3px] top-[2.5px] w-[2px] h-[4px] bg-white/80 rounded-r-[1px]"></div>
              </div>
            </div>
          </div>
        `;
      } else if (spec.osType === 'android') {
        return `
          <div class="absolute top-0 left-0 right-0 h-9 px-6 flex items-center justify-between text-white z-30 pointer-events-none select-none">
            <!-- Left Time -->
            <span class="text-[12px] font-mono font-semibold pt-0.5">${spec.timeString}</span>

            <!-- Hole Punch Center Camera -->
            ${spec.notchType === 'hole-punch-center' ? `
              <div class="absolute left-1/2 -translate-x-1/2 top-[10px] w-[13px] h-[13px] bg-black rounded-full border border-slate-800 flex items-center justify-center z-40 shadow-inner">
                <div class="w-[5px] h-[5px] bg-indigo-950/90 rounded-full border border-slate-700/60"></div>
              </div>
            ` : ''}
            ${spec.notchType === 'hole-punch-top-right' ? `
              <div class="absolute right-[48px] top-[10px] w-[13px] h-[13px] bg-black rounded-full border border-slate-800 flex items-center justify-center z-40 shadow-inner">
                <div class="w-[5px] h-[5px] bg-indigo-950/90 rounded-full"></div>
              </div>
            ` : ''}

            <!-- Right Android Status Icons -->
            <div class="flex items-center gap-2 text-[11px] pt-0.5">
              <i class="fa-solid fa-bell text-[10px] opacity-70"></i>
              <i class="fa-solid fa-wifi text-[11px]"></i>
              <i class="fa-solid fa-signal text-[11px]"></i>
              <span class="text-[11px] font-mono font-bold">98%</span>
              <i class="fa-solid fa-battery-full text-[13px]"></i>
            </div>
          </div>
        `;
      } else if (spec.osType === 'macos') {
        return `
          <div class="absolute top-0 left-0 right-0 h-[30px] px-5 bg-slate-950/90 text-slate-200 text-[12px] flex items-center justify-between z-30 border-b border-slate-800/60 font-medium select-none">
            <!-- Left macOS Menu Bar -->
            <div class="flex items-center gap-3.5">
              <i class="fa-brands fa-apple text-white text-xs"></i>
              <span class="font-bold text-white">Safari</span>
              <span class="hidden sm:inline">File</span>
              <span class="hidden sm:inline">Edit</span>
              <span class="hidden sm:inline">View</span>
              <span class="hidden sm:inline">History</span>
            </div>

            <!-- MacBook Camera Notch -->
            ${spec.notchType === 'mac-notch' ? `
              <div class="absolute left-1/2 -translate-x-1/2 top-0 w-[160px] h-[30px] bg-black rounded-b-xl flex items-center justify-center gap-2 z-40 shadow-md">
                <div class="w-[9px] h-[9px] bg-slate-950 rounded-full border border-slate-800 flex items-center justify-center">
                  <div class="w-[3px] h-[3px] bg-indigo-950 rounded-full"></div>
                </div>
                <div class="w-[3px] h-[3px] bg-emerald-500/80 rounded-full opacity-60"></div>
              </div>
            ` : ''}

            <!-- Right macOS Status -->
            <div class="flex items-center gap-3 text-[11px]">
              <i class="fa-solid fa-wifi text-[11px]"></i>
              <i class="fa-solid fa-sliders text-[11px]"></i>
              <span>Tue Aug 11</span>
              <span class="font-semibold">${spec.timeString}</span>
            </div>
          </div>
        `;
      }
      return '';
    }

    function buildHardwareButtonsHtml(spec) {
      if (!spec.sideButtons) return '';

      let leftBtns = '';
      let rightBtns = '';

      if (spec.sideButtons.left) {
        spec.sideButtons.left.forEach(btn => {
          if (btn === 'action') leftBtns += `<div class="w-1 h-6 bg-slate-700 rounded-l-md my-1"></div>`;
          if (btn === 'mute') leftBtns += `<div class="w-1 h-5 bg-slate-700 rounded-l-md my-1"></div>`;
          if (btn === 'vol-up' || btn === 'vol-down') leftBtns += `<div class="w-1 h-10 bg-slate-700 rounded-l-md my-1"></div>`;
        });
      }

      if (spec.sideButtons.right) {
        spec.sideButtons.right.forEach(btn => {
          if (btn === 'power') rightBtns += `<div class="w-1 h-12 bg-slate-700 rounded-r-md my-2"></div>`;
          if (btn === 'camera-control') rightBtns += `<div class="w-1 h-10 bg-slate-600 rounded-r-md my-2"></div>`;
          if (btn === 'vol-up' || btn === 'vol-down') rightBtns += `<div class="w-1 h-8 bg-slate-700 rounded-r-md my-1"></div>`;
        });
      }

      return `
        <div class="absolute -left-1 top-24 flex flex-col items-end z-10 pointer-events-none">${leftBtns}</div>
        <div class="absolute -right-1 top-28 flex flex-col items-start z-10 pointer-events-none">${rightBtns}</div>
      `;
    }

    function buildBlankScreenHtml(spec) {
      return `
        <div class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center p-6 text-center z-10">
          <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-indigo-400 mb-3 shadow-inner">
            <i class="fa-solid fa-globe text-lg"></i>
          </div>
          <h4 class="text-xs font-semibold text-slate-300 mb-1">Blank Screen</h4>
          <p class="text-[10px] text-slate-500 max-w-[180px] leading-relaxed">Enter a live site URL in the top pill to load on this device.</p>
        </div>
      `;
    }

    function addDevice(deviceKey = 'iphone-17-promax', options = {}) {
      const spec = DEVICE_CATALOG[deviceKey] || DEVICE_CATALOG['iphone-17-promax'];
      const instanceId = 'device-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

      const deviceData = {
        id: instanceId,
        key: deviceKey,
        landscape: options.landscape || false,
        isFolded: options.isFolded !== undefined ? options.isFolded : false,
        scale: options.scale || spec.defaultScale,
        spec: spec
      };

      state.activeDevices.push(deviceData);
      renderAllDevices();
    }

    function removeDevice(devId) {
      state.activeDevices = state.activeDevices.filter(d => d.id !== devId);
      renderAllDevices();
    }

    function toggleFoldDevice(devId) {
      const devIndex = state.activeDevices.findIndex(d => d.id === devId);
      if (devIndex === -1) return;

      state.activeDevices[devIndex].isFolded = !state.activeDevices[devIndex].isFolded;
      renderAllDevices();
    }

    function swapDevice(devId, newKey) {
      const devIndex = state.activeDevices.findIndex(d => d.id === devId);
      if (devIndex === -1) return;

      const newSpec = DEVICE_CATALOG[newKey];
      if (!newSpec) return;

      state.activeDevices[devIndex].key = newKey;
      state.activeDevices[devIndex].spec = newSpec;
      state.activeDevices[devIndex].scale = newSpec.defaultScale;

      renderAllDevices();
    }

    function rotateDevice(devId) {
      const devIndex = state.activeDevices.findIndex(d => d.id === devId);
      if (devIndex === -1) return;

      state.activeDevices[devIndex].landscape = !state.activeDevices[devIndex].landscape;
      renderAllDevices();
    }

    function renderAllDevices() {
      const wrapper = document.getElementById('devices-wrapper');
      wrapper.innerHTML = '';

      if (state.activeDevices.length === 0) {
        wrapper.innerHTML = `
          <div class="flex flex-col items-center justify-center p-12 text-center text-slate-500">
            <p class="text-sm font-medium mb-3">No active devices on stage</p>
            <button onclick="addDevice('iphone-17-promax')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-full shadow-lg transition flex items-center gap-2">
              <i class="fa-solid fa-plus"></i>
              <span>Add iPhone 17 Pro Max</span>
            </button>
          </div>
        `;
        return;
      }

      const hasUrl = Boolean(state.currentUrl.trim());

      state.activeDevices.forEach((dev, index) => {
        let spec = dev.spec;
        if (spec.category === 'foldable') {
          const foldSubSpec = dev.isFolded ? spec.folded : spec.unfolded;
          spec = { ...spec, ...foldSubSpec };
        }

        const isLandscape = dev.landscape;
        const isLastDevice = index === state.activeDevices.length - 1;

        const nativeWidth = isLandscape ? spec.height : spec.width;
        const nativeHeight = isLandscape ? spec.width : spec.height;

        let scale = dev.scale;
        if (state.globalScaleFactor !== 'auto') {
          scale = parseFloat(state.globalScaleFactor);
        }

        const scaledWidth = nativeWidth * scale;
        const scaledHeight = nativeHeight * scale;

        const frameCard = document.createElement('div');
        frameCard.id = dev.id;
        frameCard.className = 'relative flex flex-col items-center shrink-0 group transition-all duration-300';
        frameCard.style.width = `${Math.max(scaledWidth, 260)}px`;

        frameCard.innerHTML = `
          <!-- DEVICE SELECTOR HEADER DIRECTLY ABOVE THE DEVICE -->
          <div class="mb-3 flex items-center justify-between w-full min-w-[260px] gap-2 z-20">

            <div class="relative flex-1 min-w-0">
              <select
                onchange="swapDevice('${dev.id}', this.value)"
                class="w-full bg-slate-900 border border-slate-700/80 hover:border-slate-600 text-slate-200 text-xs rounded-xl px-2.5 py-1.5 pr-6 focus:outline-none focus:border-indigo-500 cursor-pointer appearance-none font-semibold shadow-md transition truncate"
              >
                ${buildDeviceSelectOptionsHtml(dev.key)}
              </select>
              <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 pointer-events-none"></i>
            </div>

            <!-- Action Buttons: Fold/Unfold, Rotate & Remove -->
            <div class="flex items-center gap-1 shrink-0">
              ${dev.spec.category === 'foldable' ? `
                <button
                  onclick="toggleFoldDevice('${dev.id}')"
                  title="Switch between Folded and Unfolded screen"
                  class="px-2 py-1 text-[10px] font-bold rounded-lg bg-indigo-900/80 hover:bg-indigo-800 text-indigo-200 border border-indigo-700/60 transition flex items-center gap-1.5 shadow-sm"
                >
                  <i class="fa-solid ${dev.isFolded ? 'fa-mobile-screen' : 'fa-book-open'} text-[10px]"></i>
                  <span>${dev.isFolded ? 'Folded' : 'Unfolded'}</span>
                </button>
              ` : ''}
              <button onclick="rotateDevice('${dev.id}')" title="Rotate orientation" class="p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-lg transition">
                <i class="fa-solid fa-rotate text-xs"></i>
              </button>
              <button onclick="removeDevice('${dev.id}')" title="Remove device" class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition">
                <i class="fa-solid fa-xmark text-xs"></i>
              </button>
            </div>

            <!-- (+) ADD BUTTON NEXT TO RIGHT-MOST DROPDOWN -->
            ${isLastDevice ? `
              <button
                onclick="addDevice('iphone-17-promax')"
                title="Add another device to comparison"
                class="w-7 h-7 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center font-bold text-xs shadow-lg shadow-indigo-600/30 transition transform active:scale-90 hover:rotate-90 shrink-0 ml-1"
              >
                <i class="fa-solid fa-plus"></i>
              </button>
            ` : ''}
          </div>

          <!-- HARDWARE CHASSIS CONTAINER -->
          <div class="relative ${spec.outerRadiusClass} device-shadow bg-slate-900 border border-slate-800/80"
               style="width: ${scaledWidth}px; height: ${scaledHeight}px; padding: ${spec.bezelWidth * scale}px;">

            <!-- Side Hardware Buttons -->
            ${buildHardwareButtonsHtml(spec)}

            <!-- INNER SCREEN VIEWPORT -->
            <div class="relative w-full h-full ${spec.screenRadiusClass} overflow-hidden bg-black shadow-inner">

              <!-- BLANK SCREEN STANDBY LAYER -->
              <div id="blank-screen-${dev.id}" class="${hasUrl ? 'hidden' : 'block'} h-full w-full">
                ${buildBlankScreenHtml(spec)}
              </div>

              <!-- NATIVE SCALED VIEWPORT CONTAINER (INCLUDES 1:1 SCALED STATUS BAR & NOTCH) -->
              <div id="viewport-wrapper-${dev.id}"
                   class="viewport-container absolute left-0 top-0 origin-top-left z-10 overflow-hidden ${hasUrl ? 'block' : 'hidden'}"
                   style="width: ${nativeWidth}px; height: ${nativeHeight}px; transform: scale(${scale});">

                <!-- OS Top Status Bar Glyphs & Camera Notch at Native 1:1 Scale -->
                ${buildStatusBarHtml(spec)}

                <iframe
                  id="iframe-${dev.id}"
                  data-device-id="${dev.id}"
                  src="${hasUrl ? state.currentUrl : 'about:blank'}"
                  class="w-full h-full border-none bg-white"
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-popups-to-escape-sandbox"
                ></iframe>
              </div>

            </div>

            <!-- MacBook Bottom Metal Base Lip -->
            ${spec.category === 'desktop' ? `
              <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-[115%] h-3 bg-slate-800 rounded-b-xl border-t border-slate-700/50 flex justify-center">
                <div class="w-16 h-1 bg-slate-900 rounded-b-md"></div>
              </div>
            ` : ''}
          </div>

          <!-- DEVICE INFORMATION BELOW DEVICE -->
          <div class="mt-3 flex flex-col items-center text-center w-full px-2">
            <p class="text-[11px] text-slate-400 font-medium">${spec.tagline}</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] font-mono text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                ${nativeWidth} × ${nativeHeight} px (${spec.dpr}x DPR)
              </span>
            </div>

            <!-- Connected Site Badge -->
            <div id="device-connected-badge-${dev.id}" class="mt-2 text-xs">
              ${hasUrl ? `
                <div class="flex flex-col items-center gap-1">
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 max-w-[220px] truncate">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
                    <span class="truncate">${state.currentUrl}</span>
                  </span>
                </div>
              ` : `
                <div class="flex flex-col items-center gap-0.5">
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] text-slate-500 bg-slate-900/60 border border-slate-800">
                    <i class="fa-solid fa-circle-pause text-[8px]"></i>
                    <span>Blank Screen</span>
                  </span>
                </div>
              `}
            </div>
          </div>
        `;

        wrapper.appendChild(frameCard);
      });
    }

    // Resolves what the user (or the ?url= launch param) typed into an absolute
    // URL. A leading "/" is treated as same-origin (used by the super admin
    // "Simulate" button, which passes the workspace's own app path so the
    // simulator's session cookies carry over) rather than being coerced into
    // "https://" like a bare domain would be.
    function resolveUrl(raw) {
      const trimmed = raw.trim();
      if (trimmed === '') return '';
      if (trimmed.startsWith('/')) return window.location.origin + trimmed;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) return trimmed;
      return 'https://' + trimmed;
    }

    function setGlobalUrl(newUrl) {
      const formattedUrl = resolveUrl(newUrl);

      state.currentUrl = formattedUrl;
      document.getElementById('url-input').value = formattedUrl;
      updateBookmarkIconState(formattedUrl);

      const statusPill = document.getElementById('connection-status-pill');
      const sslIcon = document.getElementById('ssl-icon');

      if (formattedUrl === '') {
        statusPill.textContent = 'Blank Screen';
        statusPill.className = 'text-[10px] font-mono text-slate-500 bg-slate-900 px-2 py-0.5 rounded-full border border-slate-800';
        sslIcon.className = 'fa-solid fa-globe text-slate-500 text-[11px]';
      } else {
        statusPill.textContent = 'Site Connected';
        statusPill.className = 'text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20';
        sslIcon.className = 'fa-solid fa-lock text-emerald-400 text-[11px]';
      }

      state.activeDevices.forEach(dev => {
        const blankLayer = document.getElementById(`blank-screen-${dev.id}`);
        const viewportWrapper = document.getElementById(`viewport-wrapper-${dev.id}`);
        const iframe = document.getElementById(`iframe-${dev.id}`);
        const connectedBadge = document.getElementById(`device-connected-badge-${dev.id}`);

        if (formattedUrl === '') {
          if (blankLayer) blankLayer.classList.remove('hidden');
          if (viewportWrapper) viewportWrapper.classList.add('hidden');
          if (iframe) iframe.src = 'about:blank';
          if (connectedBadge) {
            connectedBadge.innerHTML = `
              <div class="flex flex-col items-center gap-0.5">
                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] text-slate-500 bg-slate-900/60 border border-slate-800">
                  <i class="fa-solid fa-circle-pause text-[8px]"></i>
                  <span>Blank Screen</span>
                </span>
              </div>
            `;
          }
        } else {
          if (blankLayer) blankLayer.classList.add('hidden');
          if (viewportWrapper) viewportWrapper.classList.remove('hidden');
          if (iframe) iframe.src = formattedUrl;
          if (connectedBadge) {
            connectedBadge.innerHTML = `
              <div class="flex flex-col items-center gap-1">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 max-w-[220px] truncate">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
                  <span class="truncate">${formattedUrl}</span>
                </span>
              </div>
            `;
          }
        }
      });
    }

    function renderBookmarksList() {
      const listContainer = document.getElementById('bookmarks-list');
      const countTag = document.getElementById('bookmarks-count-tag');

      if (!listContainer) return;

      countTag.textContent = `${state.bookmarks.length} saved`;

      if (state.bookmarks.length === 0) {
        listContainer.innerHTML = `
          <div class="px-4 py-5 text-center text-slate-500 text-xs">
            <i class="fa-regular fa-bookmark text-base mb-1.5 opacity-60"></i>
            <p class="font-medium text-slate-400">No bookmarks saved yet</p>
            <p class="text-[10px] text-slate-500 mt-0.5">Click the bookmark icon in the URL bar to save current site.</p>
          </div>
        `;
        return;
      }

      let html = '';
      state.bookmarks.forEach((url, idx) => {
        html += `
          <div class="group flex items-center justify-between px-3 py-2 hover:bg-slate-800/80 rounded-xl cursor-pointer transition text-xs">
            <div onclick="selectBookmark('${url}')" class="flex items-center gap-2.5 flex-1 min-w-0 pr-2">
              <i class="fa-solid fa-globe text-indigo-400 text-xs shrink-0"></i>
              <span class="font-mono text-slate-200 truncate">${url}</span>
            </div>
            <button onclick="removeBookmark(${idx}, event)" title="Remove bookmark" class="opacity-0 group-hover:opacity-100 p-1 text-slate-500 hover:text-red-400 transition rounded-md">
              <i class="fa-solid fa-trash-can text-[11px]"></i>
            </button>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function toggleCurrentBookmark() {
      const urlInput = document.getElementById('url-input');
      const targetUrl = urlInput.value.trim() || state.currentUrl.trim();

      if (!targetUrl) return;

      const formattedUrl = resolveUrl(targetUrl);

      const existingIndex = state.bookmarks.indexOf(formattedUrl);
      if (existingIndex > -1) {
        state.bookmarks.splice(existingIndex, 1);
      } else {
        state.bookmarks.unshift(formattedUrl);
      }

      updateBookmarkIconState(formattedUrl);
      renderBookmarksList();
    }

    function selectBookmark(url) {
      setGlobalUrl(url);
      hideBookmarksDropdown();
    }

    function removeBookmark(index, event) {
      if (event) event.stopPropagation();
      state.bookmarks.splice(index, 1);
      updateBookmarkIconState(document.getElementById('url-input').value.trim());
      renderBookmarksList();
    }

    function updateBookmarkIconState(currentUrlVal) {
      const bookmarkIcon = document.getElementById('bookmark-icon');
      if (!bookmarkIcon) return;

      const formattedUrl = resolveUrl(currentUrlVal);

      if (state.bookmarks.includes(formattedUrl)) {
        bookmarkIcon.className = 'fa-solid fa-bookmark text-amber-400';
      } else {
        bookmarkIcon.className = 'fa-regular fa-bookmark text-slate-400';
      }
    }

    function showBookmarksDropdown() {
      renderBookmarksList();
      const dropdown = document.getElementById('bookmarks-dropdown');
      if (dropdown) dropdown.classList.remove('hidden');
    }

    function hideBookmarksDropdown() {
      const dropdown = document.getElementById('bookmarks-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
    }

    function setupEventListeners() {
      const urlInput = document.getElementById('url-input');
      const urlForm = document.getElementById('url-form');

      urlInput.addEventListener('focus', () => showBookmarksDropdown());
      urlInput.addEventListener('input', (e) => updateBookmarkIconState(e.target.value));

      document.getElementById('bookmark-btn').addEventListener('click', () => toggleCurrentBookmark());

      document.addEventListener('click', (e) => {
        const container = document.getElementById('bookmarks-dropdown');
        const form = document.getElementById('url-form');
        if (container && !form.contains(e.target) && !container.contains(e.target)) {
          hideBookmarksDropdown();
        }
      });

      urlForm.addEventListener('submit', (e) => {
        e.preventDefault();
        setGlobalUrl(urlInput.value);
        hideBookmarksDropdown();
      });

      document.getElementById('clear-all-btn').addEventListener('click', () => {
        state.activeDevices = [];
        renderAllDevices();
      });

      document.getElementById('global-scale-select').addEventListener('change', (e) => {
        state.globalScaleFactor = e.target.value;
        renderAllDevices();
      });

      document.getElementById('preset-apple-lineup').addEventListener('click', () => {
        state.activeDevices = [];
        addDevice('iphone-17-promax');
        addDevice('ipad-pro-13');
        addDevice('macbook-air-13');
      });

      document.getElementById('preset-galaxy-suite').addEventListener('click', () => {
        state.activeDevices = [];
        addDevice('galaxy-s26');
        addDevice('galaxy-s26-ultra');
        addDevice('galaxy-zfold8', { isFolded: true });
        addDevice('galaxy-zfold8-ultra', { isFolded: false });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      addDevice('iphone-17-promax');

      // Launched from super admin's "Simulate" button: ?url= carries the
      // workspace's own app path (same-origin, so the view-as session cookie
      // set just before opening this tab applies) and ?name= labels the header.
      const params = new URLSearchParams(window.location.search);
      const launchUrl = params.get('url');
      const workspaceName = params.get('name');
      if (workspaceName) {
        document.title = `${workspaceName} — Nexus DeviceSync`;
        const tag = document.getElementById('workspace-tag');
        if (tag) tag.textContent = workspaceName;
      }
      if (launchUrl) setGlobalUrl(launchUrl);
    });
  </script>
</body>
</html>
